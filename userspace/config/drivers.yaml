format_version: 1

# Compatible-ID order here has no priority. Device-provided order determines
# specificity when matching.
drivers:
  pci:
    executable: "/boot/pci_driver.elf"
    root_capabilities:
      - "memory_allocator"
      - "interrupts"
      - "io_ports"
    compatible_ids:
      - "acpi:PNP0A08"
      - "acpi:PNP0A03"
      - "acpi:MCFG"
      - "dt:pci-host-ecam-generic"

  tpm:
    executable: "/boot/tpm_driver.elf"
    compatible_ids:
      - "acpi:MSFT0101"
      - "acpi:TPM2"
      - "dt:tcg,tpm-tis-mmio"
      - "dt:tcg,tpm-crb"

  i8042:
    executable: "/boot/i8042_driver.elf"
    compatible_ids:
      - "acpi:PNP0303"
      - "acpi:i8042"

  ps2:
    executable: "/boot/ps2_driver.elf"
    compatible_ids:
      - "ps2:keyboard"
      - "ps2:mouse"
      - "ps2:device"
