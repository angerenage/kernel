format_version: 1

# Device-provided compatible-ID order determines specificity. When several
# drivers claim the same ID, declaration order here determines fallback order.
drivers:
  pci:
    executable: "/bin/pci_driver.elf"
    root_capabilities:
      - "memory_allocator"
      - "dma"
      - "interrupts"
      - "io_ports"
    compatible_ids:
      - "acpi:PNP0A08"
      - "acpi:PNP0A03"
      - "acpi:MCFG"
      - "dt:pci-host-ecam-generic"

  ahci:
    executable: "/bin/ahci_driver.elf"
    compatible_ids:
      - "pci:class:01:06:01"

  sata:
    executable: "/bin/sata_driver.elf"
    compatible_ids:
      - "ahci:sata"

  partition:
    executable: "/bin/partition_driver.elf"
    compatible_ids:
      - "block:disk"

  fat32:
    executable: "/bin/fat32_driver.elf"
    compatible_ids:
      - "gpt:ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
      - "mbr:0b"
      - "mbr:0c"
      - "block:partition"

  i8042:
    executable: "/bin/i8042_driver.elf"
    compatible_ids:
      - "acpi:PNP0303"
      - "acpi:i8042"

  ps2:
    executable: "/bin/ps2_driver.elf"
    compatible_ids:
      - "ps2:keyboard"
      - "ps2:mouse"
      - "ps2:device"
